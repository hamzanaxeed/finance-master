name: wealthtracker
description: A comprehensive personal finance management application
publish_to: 'none'
version: 1.0.0+2002

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.0.0

  # Charts
  syncfusion_flutter_charts: ^33.2.10

  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  http: ^1.6.0


  # Utils
  intl: ^0.19.0
  uuid: ^4.3.3
  shared_preferences: ^2.1.0
  flutter_secure_storage: ^8.0.0
  local_auth: ^2.2.0
  flutter_launcher_icons: ^0.13.1
  file_picker: ^10.3.3
  encrypt: ^5.0.1
  crypto: ^3.0.2
  path_provider: ^2.0.15

flutter_launcher_icons:
    android: "launcher_icon"
    ios: true
    image_path: "assets/images/logo.png"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
